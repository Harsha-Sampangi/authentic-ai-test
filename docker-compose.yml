services:
  backend:
    build: ./backend
    image: authentic.ai/backend:latest
    container_name: authentic.ai-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/heatmaps:/app/heatmaps
    environment:
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost:80
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: authentic.ai/frontend:latest
    container_name: authentic.ai-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
