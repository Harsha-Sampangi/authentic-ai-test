<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>Authenti.AI</h1>
            <span class="status-badge" id="connStatus">Checking...</span>
        </header>

        <div class="main-content">
            <div class="score-circle hidden" id="scoreCircle">
                <span id="scoreValue">0%</span>
                <span class="label">Authenticity</span>
            </div>

            <div id="initialState">
                <p class="description">Analyze current page for misinformation or deepfakes.</p>
                <button id="analyzeBtn" class="primary-btn">Analyze This Page</button>
            </div>

            <div id="loadingState" class="hidden">
                <div class="spinner"></div>
                <p>Analyzing content...</p>
            </div>

            <div id="resultState" class="hidden">
                <h3 id="verdict">Analyzed</h3>
                <p id="details">No issues found.</p>
                <button id="detailsBtn" class="secondary-btn">View Full Report</button>
            </div>
        </div>

        <footer>
            <a href="http://localhost:5173" target="_blank">Open Dashboard</a>
        </footer>
    </div>
    <script src="popup.js"></script>
</body>

</html>
